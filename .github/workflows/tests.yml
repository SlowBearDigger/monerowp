name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.0', '8.4', '8.5']

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          extensions: gmp, bcmath, mbstring
          coverage: none

      - name: Check PHP syntax
        run: find . -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Check JavaScript syntax
        run: find assets/js -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Run offline tests
        run: |
          # scanner.test.php uses a live stagenet RPC endpoint.
          php tests/crypto.test.php
          php tests/node-auth.test.php
          php tests/node-config.test.php
          php tests/parity.test.php
          php tests/cleanup.test.php
